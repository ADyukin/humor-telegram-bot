[project]
name = "humor-telegram-bot"
version = "0.1.0"
description = "Telegram trainer for practicing humor"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28.1",
  "faster-whisper>=1.1.0",
  "python-dotenv>=1.1.0",
]

[project.scripts]
humor-bot = "humor_bot.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
